<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>북마크 매니저</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form input {
            flex: 1;
            padding: 0.5rem;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .name {
            cursor: pointer;
            color: #0066cc;
        }

        .name:hover {
            text-decoration: underline;
        }

        .url {
            flex: 1;
            text-align: right;
            color: #999;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .star {
            cursor: pointer;
            user-select: none;
            color: #ccc;
            font-size: 1.2rem;
        }

        .star.active {
            color: gold;
        }

        .delete-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>나의 북마크</h1>
    <div class="form">
        <input type="text" id="nameInput" placeholder="사이트 이름">
        <input type="url" id="urlInput" placeholder="https://...">
        <button id="addBtn">추가</button>
    </div>
    <ul id="bookmarkList"></ul>

    <script>
        const nameInput = document.querySelector('#nameInput');
        const urlInput = document.querySelector('#urlInput');
        const addBtn = document.querySelector('#addBtn');
        const list = document.querySelector('#bookmarkList');

        const STORAGE_KEY = 'bookmarks';

        // 데이터 모델: [{ id, name, url, starred }, ...]
        let bookmarks = [];

        // AI: Claude Code 생성, 검증 완료
        // innerHTML 삽입 전 사용자 입력 이스케이프 — XSS 방지
        const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        // AI: Claude Code 생성, 검증 완료
        // P1 — http:// / https:// 누락 시 자동 보완
        const normalizeUrl = (url) => /^https?:\/\//i.test(url) ? url : 'https://' + url;

        const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));

        // TODO 1: 페이지 로드 시 localStorage에서 bookmarks 배열 복원 + 렌더링
        // AI: Claude Code 생성, 검증 완료
        bookmarks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        // TODO 2: render() — bookmarks 배열을 화면에 그리기
        // AI: Claude Code 생성, 검증 완료
        const render = () => {
            // P1 — 별표 활성된 항목이 위로 (true=1, false=0 → 내림차순)
            bookmarks.sort((a, b) => (b.starred - a.starred));
            list.innerHTML = bookmarks.map(b => `
                <li data-id="${b.id}">
                    <span class="name" data-action="open">${escapeHtml(b.name)}</span>
                    <span class="url">${escapeHtml(b.url)}</span>
                    <span class="star ${b.starred ? 'active' : ''}" data-action="star">★</span>
                    <button class="delete-btn" data-action="delete">삭제</button>
                </li>
            `).join('');
        };
        render();

        // TODO 3: 추가 버튼 — 이름+URL 받아서 bookmarks에 추가 + 저장 + 렌더링
        // AI: Claude Code 생성, 검증 완료
        addBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            const url = urlInput.value.trim();
            if (!name || !url) return; // P0 — 빈 값 거부
            bookmarks.push({
                id: Date.now().toString(),
                name,
                url: normalizeUrl(url),
                starred: false
            });
            save();
            render();
            nameInput.value = '';
            urlInput.value = '';
            nameInput.focus();
        });

        // TODO 4: 이벤트 위임 — list에 click 1개로 별표 토글 / 삭제 / 사이트명 클릭 시 window.open
        // AI: Claude Code 생성, 검증 완료
        list.addEventListener('click', (e) => {
            const li = e.target.closest('li');
            if (!li) return;
            const id = li.dataset.id;
            const action = e.target.dataset.action;
            const bm = bookmarks.find(b => b.id === id);
            if (!bm) return;

            if (action === 'star') {
                bm.starred = !bm.starred;
                save();
                render();
            } else if (action === 'delete') {
                bookmarks = bookmarks.filter(b => b.id !== id);
                save();
                render();
            } else if (action === 'open') {
                window.open(bm.url, '_blank');
            }
        });
    </script>
</body>

</html>
