<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>실습 2-4</title>
    <style>
      .box{
        width:300px;
        height:70px;     
        margin:0 auto;
      }
      #style1 {
        background-color:#2121f4;          
        color:white;      
      }    
      #style2 {
        color: rgba(255,255,255,0.7);
        background: linear-gradient(to right, #cc00ff, #660066);
      }    
      #style3 {
        color: rgba(255,255,255,0.7);
        background: radial-gradient(circle at center, #000066, #0000ff);
      }    
      h1 {
        text-align: center;
        line-height: 70px;
      }
      h1 {
        text-shadow: 4px 3px 10px black;
      }
    </style>
  </head>
  <body>
    <div class="box" id="style1">
      <h1 id="basic">웹 개발 기초</h1>
    </div>
    <div class="box" id="style2">
      <h1>웹 개발 중급</h1>
    </div>
    <div class="box" id="style3">
      <h1>웹 개발 고급</h1>
    </div>
  </body>
</html>
