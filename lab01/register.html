<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>사용자 등록</title>
</head>
<body>
    <header>
        <h1>사용자 등록 신청서</h1>
    </header>
    <main>
        <form action="">
            <fieldset>
                <legend>기본 정보 (Essential)</legend>
                <div>
                    <label for="login">아이디:</label><br/>
                    <input type="text" name="login" id="login" placeholder="4~12자 영문/숫자">
                </div>
                <div>
                    <label for="password">비밀번호:</label><br/>
                    <input type="password" name="password" id="password">
                </div>
                <div>
                    <label for="email">이메일:</label><br/>
                    <input type="email" name="email" id="email">
                </div>
            </fieldset>
            <fieldset>
                <legend>부가 정보 (Optional)</legend>
                <div>
                    <label for="phone">연락처:</label><br/>
                    <input type="tel" name="phone" id="phone" placeholder="010-1234-5678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}]">
                </div>
                <div>
                    <span>관심 분야:</span><br/>
                    <input type="checkbox" name="html" id="html" value="html">
                    <label for="html">HTML5</label>
                    <input type="checkbox" name="css" id="css" value="css">
                    <label for="css">CSS3</label>
                    <input type="checkbox" name="javascript" id="javascript" value="javascript">
                    <label for="javascript">JavaScript</label>
                </div>
                <div>
                    <label for="skill">숙련도:</label><br/>
                    <input type="range" name="skill" id="skill" min="0" max="100" value="0" step="10">
                </div>
            </fieldset>
            <div>
                <button>가입 신청</button>
                <button>초기화</button>
            </div>
        </form>
    </main>
    <footer>
        <p><a href="index.html">홈으로</a></p>
        <p>&copy; 2026 Web Programming Course. All rights reserved.</p>
    </footer>
</body>
</html>
