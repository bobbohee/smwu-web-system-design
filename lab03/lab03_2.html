<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실전 반응형 레이아웃 실습</title>
    <style>
        /* [분석1] 박스 모델 설계: border-box를 적용하면 padding과 border가
           width 안에 포함되어 레이아웃 계산이 직관적이고, 요소가 의도치 않게 넘치지 않는다 */
        * {
            margin: 0;  /* 브라우저 기본 여백 초기화 */
            padding: 0; /* 브라우저 기본 패딩 초기화 */
            box-sizing: border-box; /* padding/border를 width에 포함 */
        }

        body {
            font-family: 'Pretendard', sans-serif;
            line-height: 1.6;  /* 줄 간격을 1.6배로 설정하여 가독성 향상 */
            background-color: #f4f7f6; /* 연한 회색 배경으로 콘텐츠 영역과 구분 */
        }

        a {
            text-decoration: none; /* 링크 밑줄 제거 */
            color: inherit; /* 부모 요소의 글자색을 상속받아 일관된 색상 유지 */
        }

        ul {
            list-style: none; /* 리스트 기본 불릿 제거 */
        }

        /* [분석5] 고정: sticky로 스크롤 시 네비바가 상단에 고정됨 */
        .navbar {
            display: flex; /* Flexbox로 로고와 메뉴를 가로 배치 */
            justify-content: space-between; /* 로고는 왼쪽, 메뉴는 오른쪽으로 분산 배치 */
            align-items: center; /* 세로 중앙 정렬 */
            background-color: #2c3e50;
            color: white;
            padding: 1rem 5%; /* 상하 1rem, 좌우 5%로 반응형 패딩 */
            position: sticky; /* 스크롤해도 화면 상단에 고정 */
            top: 0; /* 상단 기준점 */
            z-index: 1000; /* 다른 요소 위에 표시되도록 높은 z-index */
        }

        .nav-links {
            display: flex; /* 메뉴 항목들을 가로로 배치 */
            gap: 20px; /* 메뉴 항목 간 20px 간격 */
        }

        /* 햄버거 메뉴 아이콘: 기본적으로 숨김, 모바일에서만 표시 */
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* [분석2] 유연한 레이아웃: 양쪽 사이드바 200px 고정, 가운데 main이
           남은 공간(1fr)을 모두 차지하여 브라우저 너비에 따라 유연하게 변함 */
        .container {
            display: grid;
            grid-template-columns: 200px 1fr 200px; /* 좌200px | 메인(가변) | 우200px */

            gap: 20px; /* 그리드 아이템 간 간격 */
            padding: 20px 5%; /* 좌우 5% 패딩으로 반응형 여백 */
            min-height: 80vh; /* 최소 높이를 뷰포트의 80%로 설정 */
        }

        aside {
            background: #dfe6e9; /* 사이드바 배경색 (연한 회색) */
            padding: 20px;
            border-radius: 8px; /* 모서리를 둥글게 */
        }

        main {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* 그림자 효과로 카드가 떠있는 느낌 */
        }

        /* [분석3] 자동 카드 배치: auto-fit + minmax로 미디어 쿼리 없이도
           화면 너비에 따라 한 줄의 카드 개수가 자동 조절됨
           - 최소 250px 보장, 남는 공간은 1fr로 균등 분배
           - 공간이 250px 미만이면 자동으로 다음 줄로 넘어감 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden; /* border-radius 적용 시 자식 요소가 넘치지 않도록 */
            transition: transform 0.3s ease; /* hover 애니메이션을 0.3초 동안 부드럽게 전환 */
        }

        /* 카드에 마우스를 올리면 위로 10px 이동하는 인터랙션 효과 */
        .card:hover {
            transform: translateY(-10px);
        }

        .card-img {
            width: 100%;
            height: 150px;
            background: #bdc3c7;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* [분석5] 텍스트 생략: -webkit-line-clamp로 긴 텍스트를 2줄로 제한하고
           초과분은 말줄임표(...)로 표시 */
        .card-desc {
            font-size: 0.9rem;
            color: #666;
            display: -webkit-box; /* line-clamp 사용을 위한 필수 설정 */
            -webkit-line-clamp: 2; /* 최대 2줄까지만 표시 */
            -webkit-box-orient: vertical; /* 세로 방향 정렬 (line-clamp 필수) */
            overflow: hidden; /* 초과 텍스트 숨김 → 말줄임표 처리 */
        }

        /* 태블릿 대응 (1024px 이하): 3단 → 2단 레이아웃으로 전환 */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 200px 1fr; /* 우측 사이드바 컬럼 제거 → 2단 */
            }

            .right-sidebar {
                grid-column: span 2; /* 우측 사이드바가 2칸을 차지하여 하단 전체 너비로 이동 */
            }
        }

        /* [분석4] 모바일 대응 (768px 이하): 2단 → 1단 레이아웃으로 전환
           order 속성으로 HTML 순서와 무관하게 시각적 배치 순서를 변경 */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* 텍스트 메뉴 숨김 */
            }

            .menu-toggle {
                display: block; /* 햄버거 메뉴 아이콘(☰) 표시 */
            }

            .container {
                grid-template-columns: 1fr; /* 1단 레이아웃: 모든 요소가 세로로 배치 */
            }

            /* HTML에서 left-sidebar가 main보다 먼저 작성되어 있지만,
               order 속성으로 main(order:1)을 사이드바(order:2)보다 위에 배치 */
            .left-sidebar,
            .right-sidebar {
                order: 2; /* 사이드바를 메인 콘텐츠 아래로 이동 */
            }

            main {
                order: 1; /* 메인 콘텐츠를 최상단에 배치 */
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">MyResponsiveWeb</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="menu-toggle">☰</div>
    </nav>

    <div class="container">
        <aside class="left-sidebar">
            <h3>카테고리</h3>
            <ul>
                <li>메뉴 1</li>
                <li>메뉴 2</li>
            </ul>
        </aside>

        <main>
            <h2>최신 포스트</h2>

            <div class="card-grid">
                <article class="card">
                    <div class="card-img"></div>
                    <div class="card-content">
                        <div class="card-title">프로젝트 01</div>
                        <p class="card-desc">이곳은 프로젝트의 상세 설명이 들어가는 부분입니다. 내용이 길어지면 자동으로 말줄임표 처리가 됩니다.</p>
                    </div>
                </article>
                <article class="card">
                    <div class="card-img"></div>
                    <div class="card-content">
                        <div class="card-title">프로젝트 02</div>
                        <p class="card-desc">반응형 웹 디자인의 기초인 Flex와 Grid를 활용하여 멋진 결과물을 만들어 보세요.</p>
                    </div>
                </article>
                <article class="card">
                    <div class="card-img"></div>
                    <div class="card-content">
                        <div class="card-title">프로젝트 03</div>
                        <p class="card-desc">CSS 미디어 쿼리를 사용하면 기기에 최적화된 화면을 제공할 수 있습니다.</p>
                    </div>
                </article>
            </div>
        </main>

        <aside class="right-sidebar">
            <h3>광고/공지</h3>
            <p>오늘의 새로운 소식을 확인하세요!</p>
        </aside>
    </div>

    <script>

    </script>
</body>

</html>
